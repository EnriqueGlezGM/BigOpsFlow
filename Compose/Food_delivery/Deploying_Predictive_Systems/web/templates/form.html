<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Predicción de entrega</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .spin { display: none; }
    #resultCard { display: none; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: .9rem; }
  </style>
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand-lg bg-body border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="#">TFM - Enrique González Macías</a>
      <div class="form-check form-switch ms-auto">
        <input class="form-check-input" type="checkbox" id="themeToggle">
        <label class="form-check-label" for="themeToggle">Modo claro</label>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row g-4">
      <!-- Formulario -->
      <div class="col-12 col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-3">Formulario de Predicción</h1>
            <p class="text-secondary mb-4">Rellena los campos y lanzaremos una predicción en streaming. Tras enviarlo, esta página hará <em>polling</em> hasta recibir el resultado.</p>

            <div id="alertHost"></div>

            <form id="predictForm" novalidate>
              <div class="row g-3">

                <div class="col-12 col-md-6"><label for="delivery_person_age" class="form-label">Edad del repartidor</label><input type="number" class="form-control" id="delivery_person_age" value="30" min="18" max="70" required></div>
                <div class="col-12 col-md-6"><label for="delivery_person_ratings" class="form-label">Valoración del repartidor</label><input type="number" class="form-control" id="delivery_person_ratings" value="4.7" min="1" max="5" step="0.1" required></div>
                <div class="col-12 col-md-6"><label for="restaurant_latitude" class="form-label">Latitud del restaurante</label><input type="number" class="form-control" id="restaurant_latitude" value="22.651847" min="-90" max="90" step="any" required></div>
                <div class="col-12 col-md-6"><label for="restaurant_longitude" class="form-label">Longitud del restaurante</label><input type="number" class="form-control" id="restaurant_longitude" value="75.881991" min="-180" max="180" step="any" required></div>
                <div class="col-12 col-md-6"><label for="delivery_location_latitude" class="form-label">Latitud de entrega</label><input type="number" class="form-control" id="delivery_location_latitude" value="22.721847" min="-90" max="90" step="any" required></div>
                <div class="col-12 col-md-6"><label for="delivery_location_longitude" class="form-label">Longitud de entrega</label><input type="number" class="form-control" id="delivery_location_longitude" value="75.951991" min="-180" max="180" step="any" required></div>
                <div class="col-12 col-md-6"><label for="order_date_and_time" class="form-label">Fecha y hora del pedido</label><input type="datetime-local" class="form-control" id="order_date_and_time" value="2026-08-30T20:00" required></div>
                <div class="col-12 col-md-6"><label for="weather_conditions" class="form-label">Meteorología</label><select class="form-select" id="weather_conditions" required><option>Sunny</option><option>Cloudy</option><option>Fog</option><option>Stormy</option><option>Sandstorms</option><option>Windy</option></select></div>
                <div class="col-12 col-md-6"><label for="road_traffic_density" class="form-label">Densidad de tráfico</label><select class="form-select" id="road_traffic_density" required><option>Low</option><option selected>Medium</option><option>High</option><option>Jam</option></select></div>
                <div class="col-12 col-md-6"><label for="vehicle_condition" class="form-label">Estado del vehículo</label><select class="form-select" id="vehicle_condition" required><option value="0">0</option><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option></select></div>
                <div class="col-12 col-md-6"><label for="type_of_order" class="form-label">Tipo de pedido</label><select class="form-select" id="type_of_order" required><option>Snack</option><option>Drinks</option><option selected>Meal</option><option>Buffet</option></select></div>
                <div class="col-12 col-md-6"><label for="type_of_vehicle" class="form-label">Tipo de vehículo</label><select class="form-select" id="type_of_vehicle" required><option selected>motorcycle</option><option>scooter</option><option>electric_scooter</option><option>bicycle</option></select></div>
                <div class="col-12 col-md-6"><label for="multiple_deliveries" class="form-label">Entregas simultáneas</label><input type="number" class="form-control" id="multiple_deliveries" value="1" min="0" max="5" required></div>
                <div class="col-12 col-md-6"><label for="festival" class="form-label">Festival</label><select class="form-select" id="festival" required><option selected>No</option><option>Yes</option></select></div>
                <div class="col-12 col-md-6"><label for="city" class="form-label">Tipo de ciudad</label><select class="form-select" id="city" required><option selected>Metropolitian</option><option>Urban</option><option>Semi-Urban</option></select></div>
              </div>

              <div class="d-flex align-items-center gap-3 mt-4">
                <span class="d-inline-block" id="submitTooltipWrap" tabindex="0" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Habilitado cuando el streaming de predicción esté activo" style="cursor: not-allowed;">
                  <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span class="spinner-border spinner-border-sm me-2 spin" role="status" aria-hidden="true"></span>
                    Enviar
                  </button>
                </span>
                <button type="button" class="btn btn-outline-secondary" id="resetBtn">Reset</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Resultado -->
      <div class="col-12 col-lg-5">
        <div id="resultCard" class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="h5 mb-3">Resultado</h2>
            <div class="d-flex align-items-center gap-2 mb-2">
              <span class="badge text-bg-info" id="statusBadge">esperando…</span>
              <div class="spinner-border spinner-border-sm spin" id="pollSpinner" role="status" aria-hidden="true"></div>
            </div>
            <div class="code small mb-2" id="uuidLine"></div>
            <div class="display-6 fw-semibold" id="predictionLine" style="line-height:1.2"></div>
            <hr class="my-3" />
            <details>
              <summary class="mb-2">Ver documento crudo</summary>
              <pre class="code mb-0" id="rawDoc">{}</pre>
            </details>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ---- Alternar tema (claro/oscuro) ----
    const themeToggle = document.getElementById('themeToggle');
    const htmlEl = document.documentElement;
    themeToggle?.addEventListener('change', () => {
      htmlEl.setAttribute('data-bs-theme', themeToggle.checked ? 'light' : 'dark');
    });

    const form = document.getElementById('predictForm');
    const submitBtn = document.getElementById('submitBtn');
    const submitTooltipWrap = document.getElementById('submitTooltipWrap');
    const resultCard = document.getElementById('resultCard');
    const alertHost = document.getElementById('alertHost');
    const pollSpinner = document.getElementById('pollSpinner');
    const uuidLine = document.getElementById('uuidLine');
    const statusBadge = document.getElementById('statusBadge');
    const predictionLine = document.getElementById('predictionLine');
    const rawDoc = document.getElementById('rawDoc');
    const spinEls = document.querySelectorAll('.spin');

    function setSpinning(on) {
      spinEls.forEach(el => el.style.display = on ? 'inline-block' : 'none');
      submitBtn.disabled = on ? true : submitBtn.disabled;
    }

    function showAlert(kind, msg) {
      alertHost.innerHTML = `
        <div class="alert alert-${kind} alert-dismissible fade show" role="alert">
          ${msg}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>`;
    }

    function toRFC3339Local(dtValue) {
      // el valor de datetime-local ya está en horario local "YYYY-MM-DDTHH:mm"
      return dtValue ? dtValue + ':00' : null; // añadir segundos
    }

    // Tooltip de Bootstrap (requiere el bundle JS cargado debajo)
    let submitTooltip;
    try { submitTooltip = new bootstrap.Tooltip(submitTooltipWrap); } catch {}

    function updateSubmitTooltip(running) {
      const msg = 'Habilitado cuando el streaming de predicción esté activo';
      const enabled = !!running;
      if (submitTooltip) {
        if (enabled) {
          submitTooltip.hide();
          submitTooltip.disable();
        } else {
          submitTooltip.enable();
          if (submitTooltip.setContent) {
            submitTooltip.setContent({'.tooltip-inner': msg});
          }
        }
      }
      submitTooltipWrap.setAttribute('data-bs-title', enabled ? '' : msg);
      submitTooltipWrap.style.cursor = enabled ? 'pointer' : 'not-allowed';
    }

    async function refreshPredictStatus() {
      try {
        const r = await fetch('/ops/active/predict');
        if (!r.ok) throw new Error('status ' + r.status);
        const { running } = await r.json();
        submitBtn.disabled = !running;
        updateSubmitTooltip(running);
      } catch {
        submitBtn.disabled = true;
        updateSubmitTooltip(false);
      }
    }

    // Estado inicial y comprobación periódica
    submitBtn.disabled = true;
    refreshPredictStatus();
    setInterval(refreshPredictStatus, 5000);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      setSpinning(true);
      alertHost.innerHTML = '';
      resultCard.style.display = 'block';
      statusBadge.className = 'badge text-bg-info';
      statusBadge.textContent = 'enviado';
      pollSpinner.style.display = 'inline-block';
      predictionLine.textContent = '';
      rawDoc.textContent = '{}';

      // Construir el JSON exactamente como lo espera Spark (nombres y tipos)
      const payload = {
        delivery_person_age: Number(document.getElementById('delivery_person_age').value),
        delivery_person_ratings: Number(document.getElementById('delivery_person_ratings').value),
        restaurant_latitude: Number(document.getElementById('restaurant_latitude').value),
        restaurant_longitude: Number(document.getElementById('restaurant_longitude').value),
        delivery_location_latitude: Number(document.getElementById('delivery_location_latitude').value),
        delivery_location_longitude: Number(document.getElementById('delivery_location_longitude').value),
        order_date_and_time: toRFC3339Local(document.getElementById('order_date_and_time').value),
        weather_conditions: document.getElementById('weather_conditions').value,
        road_traffic_density: document.getElementById('road_traffic_density').value,
        vehicle_condition: Number(document.getElementById('vehicle_condition').value),
        type_of_order: document.getElementById('type_of_order').value,
        type_of_vehicle: document.getElementById('type_of_vehicle').value,
        multiple_deliveries: Number(document.getElementById('multiple_deliveries').value),
        festival: document.getElementById('festival').value,
        city: document.getElementById('city').value
      };

      try {
        const res = await fetch('/mydata/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Error HTTP ' + res.status);
        const data = await res.json(); // { id: <uuid>, status: "submitted" }
        const uuid = data.id;
        uuidLine.textContent = 'UUID: ' + uuid;
        statusBadge.textContent = 'procesando…';

        // Consultar al backend hasta 60s (60000ms)
        const started = Date.now();
        const timeoutMs = 60000;
        let done = false;

        while (!done) {
          if (Date.now() - started > timeoutMs) {
            statusBadge.className = 'badge text-bg-warning';
            statusBadge.textContent = 'timeout';
            showAlert('warning', 'No llegó respuesta en 60s. Revisa que el job de Spark esté ejecutándose y Kafka/Mongo estén activos.');
            break;
          }
          await new Promise(r => setTimeout(r, 1000)); // 1 consulta/segundo

          const r = await fetch('/mydata/predict/response/' + encodeURIComponent(uuid));
          if (r.status === 404) continue; // aún no hay doc
          if (!r.ok) throw new Error('Error al consultar respuesta: ' + r.status);
          const doc = await r.json();

          // Esperar un documento con al menos { UUID, prediction }
          if (doc && (doc.prediction !== undefined)) {
            done = true;
            statusBadge.className = 'badge text-bg-success';
            statusBadge.textContent = 'listo';
            predictionLine.textContent = Number(doc.prediction).toFixed(2) + ' min';
            rawDoc.textContent = JSON.stringify(doc, null, 2);
          }
        }
      } catch (err) {
        console.error(err);
        statusBadge.className = 'badge text-bg-danger';
        statusBadge.textContent = 'error';
        showAlert('danger', 'Fallo enviando o recibiendo la predicción: ' + (err.message || err));
      } finally {
        pollSpinner.style.display = 'none';
        setSpinning(false);
        // Reevaluar si se pueden aceptar nuevas solicitudes
        refreshPredictStatus();
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      form.reset();
      alertHost.innerHTML = '';
      resultCard.style.display = 'none';
    });

    // Operaciones se gestionan en el arranque del backend; UI sin botones
  </script>
</body>
</html>
