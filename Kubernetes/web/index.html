<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predicción de tiempo de entrega</title>
  <style>
    :root {
      --bg: #0b1021;
      --card: #0f172a;
      --card2: #101b33;
      --accent: #22c55e;
      --accent-2: #00c2ff;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 32px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 20%, rgba(0,194,255,0.14), transparent 25%),
        radial-gradient(circle at 90% 10%, rgba(34,197,94,0.15), transparent 20%),
        radial-gradient(circle at 60% 80%, rgba(255,255,255,0.06), transparent 35%),
        linear-gradient(135deg, #0b1021 0%, #0c1225 50%, #0b142a 100%);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }
    h1 { margin: 0 0 8px; letter-spacing: 0.5px; }
    p { margin: 4px 0 16px; color: var(--muted); max-width: 960px; }
    .card {
      max-width: 1100px;
      margin: 0 auto;
      background: linear-gradient(145deg, var(--card), var(--card2));
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 80px rgba(0,0,0,0.45);
    }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(34,197,94,0.3); }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .row { margin-bottom: 14px; }
    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0b111f;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(34,197,94,0.25); }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 13px;
      color: var(--muted);
      white-space: pre-wrap;
    }
    .error { color: var(--error); }
    .muted { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
    .result-card {
      padding: 20px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      min-height: 200px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(34,197,94,0.12);
      color: var(--accent);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    .prediction-value {
      font-size: 46px;
      font-weight: 800;
      color: #ffffff;
      margin: 4px 0 0;
    }
    .subtle-box {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 13px;
      color: var(--muted);
      word-break: break-all;
      min-height: 80px;
    }
    .uuid-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .uuid-value {
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 13px;
      color: #cbd5e1;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Predicción de tiempo de entrega</h1>
    <p>Introduce las condiciones conocidas al registrar el pedido para estimar su duración.</p>

    <div class="layout">
      <div>
        <form id="predictForm">
          <div class="grid">
            <div><label for="delivery_person_age">Edad del repartidor</label><input id="delivery_person_age" type="number" value="30" min="18" max="70" required /></div>
            <div><label for="delivery_person_ratings">Valoración del repartidor</label><input id="delivery_person_ratings" type="number" value="4.7" min="1" max="5" step="0.1" required /></div>
            <div><label for="restaurant_latitude">Latitud del restaurante</label><input id="restaurant_latitude" type="number" value="22.651847" min="-90" max="90" step="any" required /></div>
            <div><label for="restaurant_longitude">Longitud del restaurante</label><input id="restaurant_longitude" type="number" value="75.881991" min="-180" max="180" step="any" required /></div>
            <div><label for="delivery_location_latitude">Latitud de entrega</label><input id="delivery_location_latitude" type="number" value="22.721847" min="-90" max="90" step="any" required /></div>
            <div><label for="delivery_location_longitude">Longitud de entrega</label><input id="delivery_location_longitude" type="number" value="75.951991" min="-180" max="180" step="any" required /></div>
            <div><label for="order_date_and_time">Fecha y hora del pedido</label><input id="order_date_and_time" type="datetime-local" required /></div>
            <div><label for="weather_conditions">Meteorología</label><select id="weather_conditions" required><option>Sunny</option><option>Cloudy</option><option>Fog</option><option>Stormy</option><option>Sandstorms</option><option>Windy</option></select></div>
            <div><label for="road_traffic_density">Densidad de tráfico</label><select id="road_traffic_density" required><option>Low</option><option selected>Medium</option><option>High</option><option>Jam</option></select></div>
            <div><label for="vehicle_condition">Estado del vehículo</label><select id="vehicle_condition" required><option value="0">0</option><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option></select></div>
            <div><label for="type_of_order">Tipo de pedido</label><select id="type_of_order" required><option>Snack</option><option>Drinks</option><option selected>Meal</option><option>Buffet</option></select></div>
            <div><label for="type_of_vehicle">Tipo de vehículo</label><select id="type_of_vehicle" required><option selected>motorcycle</option><option>scooter</option><option>electric_scooter</option><option>bicycle</option></select></div>
            <div><label for="multiple_deliveries">Entregas simultáneas</label><input id="multiple_deliveries" type="number" value="1" min="0" max="5" required /></div>
            <div><label for="festival">Festival</label><select id="festival" required><option selected>No</option><option>Yes</option></select></div>
            <div><label for="city">Tipo de ciudad</label><select id="city" required><option selected>Metropolitian</option><option>Urban</option><option>Semi-Urban</option></select></div>
          </div>
          <input id="UUID" type="hidden" />

          <div class="row" style="margin-top:16px;">
            <button type="submit" id="sendBtn" disabled>Enviar y predecir</button>
          </div>
        </form>
        <div id="status" class="status">Esperando análisis (Spark)...</div>
      </div>

      <div class="result-card">
        <span class="pill">Predicción</span>
        <div id="predictionValue" class="prediction-value">--</div>
        <div class="uuid-box">
          <span class="muted">UUID:</span> <span id="uuidLabel" class="uuid-value">--</span>
        </div>
        <div class="subtle-box" id="payloadBox">{ }</div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("predictForm");
    const uuidInput = document.getElementById("UUID");
    const statusBox = document.getElementById("status");
    const sendButton = document.querySelector("button[type='submit']");
    const predictBase = (() => {
      try {
        const url = new URL(window.location.href);
        return `${url.protocol}//${url.hostname}:30550`;
      } catch (e) {
        return "http://localhost:30550";
      }
    })();
    const predictUrl = `${predictBase}/predict-sync`;

    const genUuid = () =>
      "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        const v = c === "x" ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    const setUuid = () => { uuidInput.value = genUuid(); };
    setUuid();

    const orderDateInput = document.getElementById("order_date_and_time");
    const now = new Date(Date.now() - new Date().getTimezoneOffset() * 60000);
    orderDateInput.value = now.toISOString().slice(0, 16);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      sendButton.disabled = true;
      const prevBtnText = sendButton.textContent;
      sendButton.textContent = "Enviando...";
      statusBox.innerHTML = '<span class="spinner"></span>Enviando...';

      const dateValue = document.getElementById("order_date_and_time").value;
      const isoDate = dateValue ? new Date(dateValue).toISOString() : null;

      const payload = {
        UUID: uuidInput.value || genUuid(),
        delivery_person_age: Number(document.getElementById("delivery_person_age").value),
        delivery_person_ratings: Number(document.getElementById("delivery_person_ratings").value),
        restaurant_latitude: Number(document.getElementById("restaurant_latitude").value),
        restaurant_longitude: Number(document.getElementById("restaurant_longitude").value),
        delivery_location_latitude: Number(document.getElementById("delivery_location_latitude").value),
        delivery_location_longitude: Number(document.getElementById("delivery_location_longitude").value),
        order_date_and_time: isoDate,
        weather_conditions: document.getElementById("weather_conditions").value,
        road_traffic_density: document.getElementById("road_traffic_density").value,
        vehicle_condition: Number(document.getElementById("vehicle_condition").value),
        type_of_order: document.getElementById("type_of_order").value,
        type_of_vehicle: document.getElementById("type_of_vehicle").value,
        multiple_deliveries: Number(document.getElementById("multiple_deliveries").value),
        festival: document.getElementById("festival").value,
        city: document.getElementById("city").value,
      };

      try {
        const res = await fetch(predictUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data?.detail || `La API respondio con HTTP ${res.status}`);
        }
        const pred = data?.prediction ?? data?.result?.prediction;
        if (pred === undefined || pred === null) {
          throw new Error("La respuesta no contiene una prediccion");
        }
        const numericPrediction = Number(pred);
        document.getElementById("predictionValue").textContent =
          Number.isFinite(numericPrediction) ? `${numericPrediction.toFixed(2)} min` : String(pred);
        document.getElementById("uuidLabel").textContent = payload.UUID;
        document.getElementById("payloadBox").textContent = JSON.stringify(data, null, 2);
        setUuid(); // prepara la siguiente solicitud
        statusBox.textContent = "Completado.";
      } catch (err) {
        document.getElementById("predictionValue").textContent = "--";
        document.getElementById("uuidLabel").textContent = "error";
        document.getElementById("payloadBox").textContent = `Error: ${err}`;
        statusBox.textContent = `Error: ${err}`;
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = prevBtnText;
      }
    });

    async function checkReady() {
      try {
        const res = await fetch(`${predictBase}/ready`, { method: "GET" });
        if (res.ok) {
          const data = await res.json();
          if (data.ok) {
            statusBox.textContent = "Streaming de predicción activo. Puedes enviar.";
            sendButton.disabled = false;
            return;
          }
        }
      } catch (e) {
        statusBox.innerHTML = '<span class="spinner"></span>Esperando análisis (Spark)...';
      }
      sendButton.disabled = true;
      statusBox.innerHTML = '<span class="spinner"></span>Esperando análisis (Spark)...';
      setTimeout(checkReady, 2000);
    }
    sendButton.disabled = true;
    statusBox.innerHTML = '<span class="spinner"></span>Esperando análisis (Spark)...';
    checkReady();
  </script>
</body>
</html>
